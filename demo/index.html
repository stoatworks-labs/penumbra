  <body data-plugin="penumbra">
    <main id="demo">
      <noscript>
        <h1>SW Penumbra</h1>
        <p>
          An FFGL mixer that lights the layer below with three coloured lamps and
          stands this layer in front of them, the way the museum exhibit does:
          red, green and blue lamps throw cyan, magenta and yellow shadows, black
          only where all three are blocked. Each shadow is the part of its lamp a
          point of the screen can see, by similar triangles, so the shadows part
          and soften as the person steps towards the lamps, and wherever nobody
          stands the clip comes back untouched.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/penumbra">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/penumbra/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/penumbra/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/penumbra">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
